<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="L'application de l'Igna Djongo : membres, cotisations, caisse et histoire. Conçue par M.M.B.T.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});</script>
<title>Igna Djongo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Igna Djongo">
<meta name="theme-color" content="#0E5A4A">
<meta name="author" content="M.M.B.T">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout : application une colonne pensée pour téléphone. En-tête de caisse, listes, barre d'onglets fixe en bas. */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --surface-2:#E6EEE9; --ink:#13241F; --muted:#56695F; --line:#D4DED8;
  --green:#0E5A4A; --green-2:#0A4639; --on-green:#FFFFFF; --gold:#B9820A; --gold-bright:#E9B949; --gold-soft:#F6E8C6;
  --ok:#1D7449; --ok-soft:#DCF0E3; --warn:#9A5600; --warn-soft:#FBEAD0; --bad:#B3261E; --bad-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(19,36,31,.06),0 6px 20px rgba(19,36,31,.08);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:16px; --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1411; --surface:#13201C; --surface-2:#1B2C26; --ink:#E5EEE9; --muted:#97AAA2; --line:#263830;
  --green:#14614F; --green-2:#0F4E40; --on-green:#FFFFFF; --gold:#E5B247; --gold-bright:#F0C561; --gold-soft:#3A2F13;
  --ok:#62C793; --ok-soft:#163627; --warn:#F1A94F; --warn-soft:#3A2A12; --bad:#F2867E; --bad-soft:#3E1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#13201C; --surface-2:#1B2C26; --ink:#E5EEE9; --muted:#97AAA2; --line:#263830;
  --green:#14614F; --green-2:#0F4E40; --on-green:#FFFFFF; --gold:#E5B247; --gold-bright:#F0C561; --gold-soft:#3A2F13;
  --ok:#62C793; --ok-soft:#163627; --warn:#F1A94F; --warn-soft:#3A2A12; --bad:#F2867E; --bad-soft:#3E1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--nav-h) + 96px)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:800}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 16px}
.topbar .titles{display:flex;flex-direction:column;gap:2px;min-width:0}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn svg{width:22px;height:22px}
.stack{display:flex;flex-direction:column;gap:20px}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;padding:4px 0;color:var(--green);font-weight:700}
:root[data-theme="dark"] .link{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--gold)}}

/* Carte de la caisse : motif inspiré des broderies du kofia */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--green);color:var(--on-green);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(circle at 50% 50%,var(--gold-bright) 1.6px,transparent 2.2px),radial-gradient(circle at 50% 50%,var(--gold-bright) 1px,transparent 1.5px);
  background-size:18px 18px,18px 18px;background-position:0 0,9px 9px;
  -webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 100%);mask-image:linear-gradient(115deg,transparent 35%,#000 100%)}
.hero > *{position:relative}
.hero .label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero .total{font-family:var(--font-display);font-weight:800;font-size:clamp(2.3rem,11vw,3.1rem);line-height:1;letter-spacing:-.02em}
.hero .cash{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.hero .cash div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .cash .cur{font-size:.8rem;opacity:.85}
.hero .cash b{font-family:var(--font-display);font-weight:800;font-size:clamp(1.35rem,6.4vw,1.8rem);line-height:1.1;overflow-wrap:anywhere}
.hero .flows{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.95rem}
.hero .flows span{display:inline-flex;gap:6px;align-items:center}
.hero .flows b{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.progress{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--green);border-radius:99px}
.month-card{display:flex;flex-direction:column;gap:10px}
.month-card .big{font-family:var(--font-display);font-size:1.35rem;font-weight:800}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.unpaid{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.chip.unpaid .plus{color:var(--warn);font-weight:700}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:64px}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)} .amt.out{color:var(--bad)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none;color:#fff;letter-spacing:.02em}
.avatar.lg{width:72px;height:72px;font-size:1.4rem}
img.avatar{object-fit:cover;background:var(--surface-2)}
.mosaic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
@media (max-width:340px){.mosaic{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border:0;background:none;min-width:0;color:var(--ink);text-align:center}
.tile .disc{position:relative;width:100%;max-width:96px;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.tile .avatar{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;font-size:1.6rem}
.tile .tn{width:100%;font-weight:700;font-size:.8rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .dot{position:absolute;right:4%;bottom:4%;width:16px;height:16px;border-radius:50%;border:2px solid var(--surface)}
.dot.ok{background:var(--ok)} .dot.todo{background:var(--gold-bright)} .dot.wait{background:#9AA5A0}
.view-toggle{display:flex;justify-content:flex-end}
.view-toggle .seg{display:inline-grid;grid-template-columns:auto auto}
.view-toggle .seg button{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:.85rem}
.view-toggle svg{width:16px;height:16px}
.avatar.xl{width:120px;height:120px;font-size:2.2rem}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.photo-btns .btn{padding:8px 14px;min-height:0;font-size:.9rem}
.f0{background:#0E5A4A}.f1{background:#9C5B12}.f2{background:#2F5D8A}.f3{background:#8A3B57}.f4{background:#5B6B1F}.f5{background:#6A4C93}
.mv-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.mv-icon.in{background:var(--ok-soft);color:var(--ok)} .mv-icon.out{background:var(--bad-soft);color:var(--bad)}
.mv-icon svg{width:20px;height:20px}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.km{background:var(--surface-2);color:var(--green)} .pill.dia{background:var(--gold-soft);color:var(--ink)}
.pill.role{background:var(--gold-soft);color:var(--ink)}
.pill.todo{background:var(--gold-soft);color:var(--ink)}
.decl{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.decl:first-child{border-top:0}
.decl .row{display:flex;align-items:center;gap:12px}
.decl .btn-row .btn{padding:8px 12px;min-height:0;font-size:.9rem}
.quick{display:flex;gap:6px;flex:none}
.quick a{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--green);text-decoration:none}
.quick a.wa{color:#1C8D4E}
.quick a svg{width:20px;height:20px}
.group-label{display:flex;justify-content:space-between;padding:4px 4px 0;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:48px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:12px 0;outline:none}

.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.switcher .icon-btn{border:0;background:transparent}
.switcher strong{font-family:var(--font-display);font-size:1.1rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .stat{display:flex;flex-direction:column;gap:4px}
.split .stat .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.split .stat .bar i{display:block;height:100%;background:var(--green)}
.split .stat.dia .bar i{background:var(--gold-bright)}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:700}

.notice{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}

.fab{position:fixed;z-index:20;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--gold-bright);color:#1D1607;font-weight:700;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fab svg{width:20px;height:20px}

nav.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--green)}
nav.tabs button.on .ic{background:var(--surface-2)}
nav.tabs .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button.on{color:var(--gold)}}
:root[data-theme="dark"] nav.tabs button.on{color:var(--gold)}

/* Feuilles (formulaires et fiches) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,12,10,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding-inline:16px;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grabber{width:40px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.field .hint{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:700;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wa{background:#1C8D4E;color:#fff}
.btn svg{width:20px;height:20px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700}
.toggle button.on.in{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.toggle button.on.out{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.profile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.phone-line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.phone-line span{user-select:all;font-variant-numeric:tabular-nums;font-weight:700;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--font-display);font-size:1.3rem}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--bad-soft);border-radius:14px;padding:12px}

.auth{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.auth .hero{gap:8px}
.auth .hero h1{color:var(--on-green);font-size:2rem}
.auth .hero p{margin:0;opacity:.9}
.demo{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.demo b{color:var(--ink);font-variant-numeric:tabular-nums}
.pin{letter-spacing:.5em;font-variant-numeric:tabular-nums;font-weight:700}
.timeline{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.chapter{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:inherit}
.chapter::before{content:"";position:absolute;left:-25px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--gold-bright);border:3px solid var(--bg)}
.chapter .periode{font-family:var(--font-display);font-weight:800;color:var(--green);font-size:1rem}
.chapter h3{font-size:1.15rem}
.chapter .excerpt{color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.chapter .by{font-size:.8rem;color:var(--muted)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}
.annonce{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:12px 14px;color:inherit;font:inherit}
.annonce.deces{border-left-color:var(--muted)} .annonce.anda,.annonce.wukumbi{border-left-color:var(--gold-bright)}
.collecte{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:inherit;font:inherit}
.collecte h3{margin:0;font-size:1rem} .collecte .row-between{font-size:.9rem}
.collecte.closed{opacity:.75} .annonce.reunion{border-left-color:var(--green)}
.annonce h3{margin:0;font-size:1rem} .annonce .excerpt{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.annonce .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.pill.new{background:var(--green);color:#fff}
.tile2{text-align:left;color:inherit;font:inherit;gap:6px!important;min-height:132px}
.tile2 .eyebrow{display:flex;align-items:center;gap:6px} .tile2 .eyebrow .pill{font-size:.7rem;padding:1px 7px}
.tile2 .t{font-size:.95rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile2 .s{font-size:.8rem} .tile2 .go{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--green)}
:root[data-theme="dark"] .tile2 .go{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile2 .go{color:var(--gold)}}
.bilan-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)} .bilan-row:last-child{border-bottom:0}
.bilan-row b{text-align:right}
.field textarea.short{min-height:110px}
@media print{body{background:#fff} .app,.fab,nav.tabs,.toast,.no-print{display:none!important}
  .overlay{position:static;background:none;display:block} .sheet{max-height:none;overflow:visible;box-shadow:none;animation:none;max-width:none;border-radius:0}
  .grabber,.sheet-head .icon-btn{display:none}}
.story{white-space:pre-line;font-size:1.05rem;line-height:1.6;max-width:65ch}

    if (CFG.emulator){ fb.auth.useEmulator("http://" + CFG.emulator + ":9099", {disableWarnings:true}); fb.db.useEmulator(CFG.emulator, 8080); }
    else fb.db.enablePersistence({synchronizeTabs:true}).catch(() => {});
  } catch(e){ console.error(e); fb.status = "error"; render(); return; }
  fb.auth.onAuthStateChanged(u => { if (fb.signingUp) return; u ? fbEnter(u.uid) : fbLeave(); });

function fbStop(){ fb.unsub.forEach(f => f()); fb.unsub = []; fb.loaded = {}; }
function fbLeave(){ const was = fb.status; fbStop(); setSession(null); state = emptyState(); fb.status = "out"; if (was !== "out") render(); }
async function fbEnter(u){
  fbStop(); setSession(u); fb.status = "loading"; render();
  let ok = true;
  try { ok = (await fb.db.doc("access/" + u).get()).exists; } catch(e){ /* hors ligne : on essaie avec ce qui est gardé sur le téléphone */ }
  if (!ok){ fb.status = "noaccess"; render(); return; }
  const r = /^(\d+)-r\d+@/.exec((fb.auth.currentUser || {}).email || "");
  if (r) await finishRenew(u, r[1]);
  fbListen();
}
function liveRender(){
  if (document.activeElement && document.activeElement.id === "search-members" && ui.tab === "membres" && fb.status === "in"){ document.getElementById("member-list").innerHTML = memberListHTML(); return; }
  render();
}
/* Nouveau compte après un « code oublié » : on le relie à sa fiche, il reprend les rôles de l'ancien,
   puis le code de réinitialisation est effacé. Sans effet si c'est déjà fait. */
async function finishRenew(u, tel){
  try {
    const rs = await fb.db.doc("resets/" + tel).get(); if (!rs.exists) return;
    const r = rs.data(); const b = fb.db.batch();
    const mem = await fb.db.doc("members/" + r.member).get();
    if (mem.exists && !mem.data().uid) b.update(mem.ref, {uid:u});
    const ro = (await fb.db.doc("config/roles").get()).data() || {admins:[], tresoriers:[]};
    const sw = l => (l || []).includes(r.old) ? l.filter(x => x !== r.old).concat([u]) : (l || []);
    if (r.old && ((ro.admins || []).includes(r.old) || (ro.tresoriers || []).includes(r.old))) b.update(fb.db.doc("config/roles"), {admins:sw(ro.admins), tresoriers:sw(ro.tresoriers)});
    b.delete(rs.ref); await b.commit();
  } catch(e){ console.error(e); }
}
function fbListen(){
  const done = k => { fb.loaded[k] = true; if (fb.status === "loading" && ["members","ledger","roles"].every(x => fb.loaded[x])) fb.status = "in"; if (fb.status === "in") liveRender(); };
  const onErr = e => { console.error(e); if (e && e.code === "permission-denied"){ fbStop(); fb.status = "noaccess"; render(); } };
  const L = (ref, fn, k) => fb.unsub.push(ref.onSnapshot(snap => { fn(snap); done(k); }, onErr));
  L(fb.db.collection("members"), q => { state.members = q.docs.map(d => ({...d.data(), id:d.id})); }, "members");
  L(fb.db.collection("ledger"), q => { state.payments = q.docs.flatMap(d => d.data().items || []); }, "ledger");
  // à part : si les règles ne sont pas encore à jour, l'application continue de marcher sans cette liste
  fb.unsub.push(fb.db.collection("declarations").onSnapshot(q => { state.declarations = q.docs.map(d => ({...d.data(), id:d.id})); if (fb.status === "in") liveRender(); }, e => { console.warn(e); state.declarations = []; }));
  fb.unsub.push(fb.db.collection("collectes").onSnapshot(q => { state.collectes = q.docs.map(d => ({...d.data(), id:d.id})); if (fb.status === "in") liveRender(); }, e => { console.warn(e); state.collectes = []; }));
  fb.unsub.push(fb.db.collection("annonces").onSnapshot(q => { state.annonces = q.docs.map(d => ({...d.data(), id:d.id})); if (fb.status === "in") liveRender(); }, e => { console.warn(e); state.annonces = []; }));
  L(fb.db.collection("histoire"), q => { state.histoire = q.docs.map(d => ({...d.data(), id:d.id})); }, "histoire");
  L(fb.db.doc("config/roles"), d => { const r = d.data() || {}; state.roles = {admins:r.admins || [], tresoriers:r.tresoriers || []}; }, "roles");
  L(fb.db.doc("config/settings"), d => { if (d.exists) state.settings = {mensuelle:20, mensuelleKMF:5000, ...d.data()}; }, "settings");
  L(fb.db.doc("config/invite"), d => { state.invite = (d.data() || {}).code || ""; }, "invite");
}

  updateAnnonce(id, d){ if (!ONLINE){ Object.assign(state.annonces.find(x => x.id === id), d); save(); return; } fb.db.doc("annonces/" + id).update(d).catch(fail); },

  addChapter(c){ if (!ONLINE){ state.histoire.push({id:uid("h"), ...c}); save(); return; } fb.db.collection("histoire").add(c).catch(fail); },
  updateChapter(id, d){ if (!ONLINE){ Object.assign(state.histoire.find(x => x.id === id), d); save(); return; } fb.db.doc("histoire/" + id).update(d).catch(fail); },
  deleteChapter(id){ if (!ONLINE){ state.histoire = state.histoire.filter(x => x.id !== id); save(); return; } fb.db.doc("histoire/" + id).delete().catch(fail); },
  saveSettings(st){ if (!ONLINE){ state.settings = st; save(); return; } fb.db.doc("config/settings").set(st).catch(fail); },
  saveRoles(r){ if (!ONLINE){ state.roles = r; save(); return; } fb.db.doc("config/roles").update(r).catch(fail); },
  changeInvite(code){ const old = state.invite;
    if (!ONLINE){ state.invite = code; save(); return; }
    const b = fb.db.batch(); b.set(fb.db.doc("invites/" + code), {at:todayISO}); if (old && old !== code) b.delete(fb.db.doc("invites/" + old)); b.set(fb.db.doc("config/invite"), {code}); b.commit().catch(fail); },
  /* connexion : renvoie un message d'erreur, ou null si tout va bien */
  async login(tel, pin){
    if (!ONLINE){
      const m = state.members.find(x => samePhone(x.tel, tel));
      const acc = m && state.accounts.find(a => a.memberId === m.id);
      if (!m || !acc) return "Aucun compte avec ce numéro. Crée ton compte d'abord.";
      if (acc.pin !== pin) return "Code incorrect. Réessaie.";
      setSession(m.id); return null;
    }
    let n = 0; try { n = await accountN(tel); } catch(e){ /* hors ligne : on essaie l'adresse de départ */ }
    try { await fb.auth.signInWithEmailAndPassword(emailOf(tel, n), pwdOf(pin)); return null; } catch(e){ return authMsg(e); }
  },
  /* « Code oublié » : un responsable crée un code de réinitialisation à 6 chiffres pour ce membre.
     L'ancien compte perd l'accès ; le membre choisit un nouveau code avec ce code-là. Renvoie le code. */
  async resetPin(m){
    const code = newResetCode(), tel = m.telKey || waNumber(m.tel);
    if (!ONLINE){ state.accounts = state.accounts.filter(a => a.memberId !== m.id); state.resets = {...(state.resets || {}), [tel]:{code, member:m.id}}; save(); return code; }
    try {
      const prev = await fb.db.doc("resets/" + tel).get();
      const old = m.uid || (prev.exists && prev.data().old) || "";
      const n = (await accountN(tel)) + 1;
      const b = fb.db.batch();
      b.set(fb.db.doc("comptes/" + tel), {n});
      b.set(fb.db.doc("resets/" + tel), {code, old, member:m.id, at:todayISO});
      if (m.uid){ b.update(fb.db.doc("members/" + m.id), {uid:FV().delete()}); b.delete(fb.db.doc("access/" + m.uid)); }

  },
  async renew(tel, rcode, pin){
    const k = waNumber(tel);
    if (!ONLINE){
      const r = (state.resets || {})[k];
      if (!r || r.code !== rcode) return "Le code reçu n'est pas bon. Vérifie-le ou demande-en un autre au responsable.";
      state.accounts = state.accounts.filter(a => a.memberId !== r.member); state.accounts.push({memberId:r.member, pin});
      delete state.resets[k]; save(); setSession(r.member); return null;
    }
    let n; try { n = await accountN(k); } catch(e){ return "Pas de connexion internet. Réessaie."; }
    if (!n) return "Aucun nouveau code n'a été demandé pour ce numéro. Demande au responsable de l'igna.";
    fb.signingUp = true;
    let user, created = false;
    try { user = (await fb.auth.createUserWithEmailAndPassword(emailOf(k, n), pwdOf(pin))).user; created = true; }
    catch(e){
      if ((e && e.code) !== "auth/email-already-in-use"){ fb.signingUp = false; return authMsg(e); }
      // déjà commencé avant (connexion coupée) : on reprend avec le même nouveau code
      try { user = (await fb.auth.signInWithEmailAndPassword(emailOf(k, n), pwdOf(pin))).user; }
      catch(_){ fb.signingUp = false; return "Ce code a déjà servi. Demande un nouveau code au responsable."; }
    }
    const u = user.uid;
    try {
      if (!(await fb.db.doc("access/" + u).get()).exists) await fb.db.doc("access/" + u).set({code:rcode, at:todayISO, tel:k});
    } catch(e){
      if (created) try { await user.delete(); } catch(_){}
      try { await fb.auth.signOut(); } catch(_){}
      fb.signingUp = false; fbStop(); setSession(null); fb.status = "out";
      return e && e.code === "permission-denied" ? "Le code reçu n'est pas bon. Vérifie-le ou demande-en un autre au responsable." : "Pas de connexion internet. Réessaie."; }
    fb.signingUp = false; await fbEnter(u); return null;
  },
  async signup(d, pin, code){
    const first = !ONLINE && !state.roles.admins.length;
    if (!ONLINE){
      if (!first && code !== state.invite) return "Le code de l'igna n'est pas bon. Demande-le sur le groupe WhatsApp.";
      let m = state.members.find(x => samePhone(x.tel, d.tel));
      if (m && state.accounts.some(a => a.memberId === m.id)) return "Ce numéro a déjà un compte. Connecte-toi.";

      m.uid = m.id; state.accounts.push({memberId:m.id, pin});

    const u = cred.user.uid;

    catch(e){ try { await cred.user.delete(); } catch(_){} fb.signingUp = false; fbStop(); setSession(null); fb.status = "out";
      return e && e.code === "permission-denied" ? "Le code de l'igna n'est pas bon. Demande-le sur le groupe WhatsApp." : "Pas de connexion internet. Réessaie."; }
    try {
      if (!(await fb.db.doc("config/roles").get()).exists){
        const b = fb.db.batch(); b.set(fb.db.doc("config/roles"), {admins:[u], tresoriers:[u]}); b.set(fb.db.doc("invites/" + code), {at:todayISO}); b.set(fb.db.doc("config/invite"), {code}); await b.commit();

    fb.signingUp = false; await fbEnter(u); return null;
  },
  async join(code){
    try { await fb.db.doc("access/" + myUid()).set({code, at:todayISO}); } catch(e){ return e && e.code === "permission-denied" ? "Le code de l'igna n'est pas bon." : "Pas de connexion internet. Réessaie."; }

const okPhoto = v => typeof v === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v);

  if (okPhoto(m.photo)) return `<img class="avatar ${cls||""}" src="${m.photo}" alt="" aria-hidden="true">`;
  return `<span class="avatar ${famClass(m.famille)} ${cls||""}" aria-hidden="true">${esc(initials(m.nom))}</span>`;

/* La photo est réduite dans le téléphone (carré de 256 px, quelques dizaines de Ko)
   puis rangée dans la fiche du membre : pas besoin de stockage payant. */
function loadImage(file){
  return new Promise((ok, ko) => { const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); ok(im); }; im.onerror = () => { URL.revokeObjectURL(url); ko(new Error("image")); }; im.src = url; });
}
async function shrinkPhoto(file){
  const im = await loadImage(file);
  const w = im.naturalWidth, h = im.naturalHeight, side = Math.min(w, h); if (!side) throw new Error("image");
  for (const [size, q] of [[256,.8],[256,.65],[200,.6],[160,.55]]){
    const c = document.createElement("canvas"); c.width = c.height = size;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
    ctx.drawImage(im, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
    const data = c.toDataURL("image/jpeg", q);
    if (data.length <= 60000) return data;
  }
  throw new Error("trop lourde");
}

function chartSVG(){
  const months = []; for (let i = -5; i <= 0; i++) months.push(shiftMonth(curMonth, i));
  const vals = months.map(v => Math.round(monthIn(v))); const max = Math.max(...vals, 1);
  const W = 320, H = 150, top = 22, base = 122, bw = 34, gap = (W - bw*6) / 6;
  const bars = months.map((mk,i) => {
    const h = Math.max(2, (vals[i] / max) * (base - top));
    const x = gap/2 + i*(bw+gap), y = base - h;
    const fill = mk === curMonth ? "var(--gold-bright)" : "var(--green)";
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" style="fill:${fill}"/>
      <text class="v" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${nf.format(vals[i])}</text>
      <text x="${x+bw/2}" y="${base+18}" text-anchor="middle">${esc(monthShort(mk))}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Montants encaissés sur les 6 derniers mois"><line x1="0" x2="${W}" y1="${base}" y2="${base}" style="stroke:var(--line)"/>${bars}</svg>`;
}

  const d = {titre:get("titre").slice(0,200), texte:get("texte").slice(0,5000), objectif, devise: get("devise") === "KMF" ? "KMF" : "EUR", fin: /^\d{4}-\d{2}-\d{2}$/.test(get("fin")) ? get("fin") : ""};
  const err = form.querySelector("#co-error"); const bad = t => { err.textContent = t; err.hidden = false; };

  const id = form.dataset.id;
  if (id){ store.updateCollecte(id, d); toast("Collecte modifiée"); closeSheet(); render(); collecteSheet(id); return; }

const deMois = mk => { const l = monthLabel(mk).toLowerCase(); return (/^[aeiouy]/.test(l) ? "d'" : "de ") + l; };
function bilanData(mk){
  const pays = state.payments.filter(p => p.date.startsWith(mk));
  const inn = sumBag(pays.filter(p => !isOut(p))), out = sumBag(pays.filter(isOut));
  const sorties = pays.filter(isOut).sort((a,b) => a.date.localeCompare(b.date));
  const lieu = k => { const g = state.members.filter(m => m.lieu === k); return [g.filter(m => isUpToDate(m.id, mk)).length, g.length]; };
  const ok = state.members.filter(m => isUpToDate(m.id, mk)).length;
  return {inn, out, sorties, ok, n:state.members.length, km:lieu("comores"), dia:lieu("diaspora"), t:totals()};
}

async function submitLogin(form){

  if (!tel || !/^\d{4}$/.test(pin)) return authError(form, "Entre ton numéro et ton code à 4 chiffres.");
  if (waNumber(tel).length < 6) return authError(form, "Vérifie ton numéro de téléphone.");
  busy(form, true); const err = await store.login(tel, pin); busy(form, false);
  if (err) return authError(form, err);

async function submitSignup(form){
  const f = new FormData(form); const get = k => String(f.get(k)||"").trim();
  const d = {nom:get("nom"), tel:get("tel"), famille:get("famille"), ville:get("ville"), lieu:get("lieu")==="comores"?"comores":"diaspora"};
  if (!d.nom || !d.tel || !d.famille || !d.ville) return authError(form, "Remplis ton nom, ton numéro, ta famille et ta ville.");
  if (waNumber(d.tel).length < 6) return authError(form, "Vérifie ton numéro de téléphone.");
  if (!/^\d{4}$/.test(get("pin"))) return authError(form, "Le code doit faire 4 chiffres.");
  if (get("pin") !== get("pin2")) return authError(form, "Les deux codes ne sont pas pareils.");
  const code = cleanCode(get("code"));
  if (!validCode(code)) return authError(form, "Entre le code de l'igna (au moins 4 lettres ou chiffres, sans espace).");
  if (!/^famille\s/i.test(d.famille)) d.famille = "Famille " + d.famille;
  d.telKey = waNumber(d.tel);
  busy(form, true); const err = await store.signup(d, get("pin"), code); busy(form, false);
  if (err) return authError(form, err);

function render(){

  if (locked){

      <div class="field"><label for="set-amount-kmf">Comores (FC)</label><input id="set-amount-kmf" name="mensuelleKMF" type="number" inputmode="numeric" min="1" step="1" value="${state.settings.mensuelleKMF}"></div></div>
    <span class="hint">Un membre est « à jour » quand il a versé au moins ce montant dans le mois.</span>
    <button class="btn primary" type="submit">Enregistrer</button>
  </form>` : `<div class="card num"><b>${esc(money(state.settings.mensuelle,"EUR"))}</b> par mois dans la diaspora, <b>${esc(money(state.settings.mensuelleKMF,"KMF"))}</b> aux Comores.</div>`}
  </div>
  <div class="section"><h2>Code de l'igna</h2>
    <div class="phone-line"><span>${esc(state.invite || "—")}</span></div>
    <span class="hint">Les nouveaux en ont besoin pour créer leur compte. Ne le donne qu'aux membres de l'igna.</span>
    ${state.invite ? `<a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">${ICONS.wa}Inviter sur WhatsApp</a>` : ""}
    ${isAdmin() ? `<form id="invite-form" class="stack" novalidate><div class="field"><label for="inv-code">Changer le code</label><input id="inv-code" name="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Nouveau code"></div>
      <span class="hint">L'ancien code ne marchera plus pour créer un compte. Ceux qui ont déjà un compte ne sont pas touchés.</span>
      <p class="field hint" id="inv-error" hidden style="color:var(--bad)"></p><button class="btn ghost" type="submit">Changer le code</button></form>` : ""}
  </div>
  ${isAdmin() ? `<div class="section"><h2>Qui fait quoi</h2>
    <form id="roles-form" class="stack" novalidate>
      <span class="hint">Coche qui peut <b>enregistrer les paiements</b> (trésorier) et qui est <b>responsable</b> (peut gérer les membres, le code de l'igna et ces réglages).</span>
      <div class="list">${accounts.map(m => `<div class="item" style="flex-wrap:wrap">${avatar(m)}<span class="body"><span class="name">${esc(m.nom)}</span><span class="sub">${esc(m.role || "Membre")}</span></span>
        <span style="display:flex;flex-direction:column;gap:4px;font-size:.85rem">
          <label><input type="checkbox" name="t" value="${esc(m.uid)}" ${state.roles.tresoriers.includes(m.uid) ? "checked" : ""}> Trésorier</label>
          <label><input type="checkbox" name="a" value="${esc(m.uid)}" ${state.roles.admins.includes(m.uid) ? "checked" : ""}> Responsable</label></span></div>`).join("") || `<div class="empty">Personne n'a encore de compte.</div>`}</div>
      <p class="field hint" id="roles-error" hidden style="color:var(--bad)"></p>
      <button class="btn primary" type="submit">Enregistrer</button>
    </form></div>` : ""}
  <div class="section"><h2>Mon compte</h2>
    ${myRoles ? `<span class="hint">Tu es ${esc(myRoles)}.</span>` : ""}
    ${me() ? `<button class="btn ghost" type="button" data-action="my-profile">Voir mon profil</button>` : ""}
    <button class="btn ghost" type="button" data-action="logout">Se déconnecter</button>
  </div>
  ${ONLINE ? "" : `<div class="section"><h2>Démonstration</h2>
    <button class="btn ghost" type="button" data-action="ask-delete">Remettre les données d'exemple</button>
    <div class="confirm" id="confirm-del" hidden><span>Effacer tout ce qui a été saisi sur ce téléphone et revenir aux exemples ?</span>
      <div class="btn-row"><button class="btn ghost" type="button" data-action="cancel-delete">Annuler</button><button class="btn danger" type="button" data-action="reset">Oui, remettre</button></div></div>
    <button class="btn ghost" type="button" data-action="clear-all">Partir d'une liste vide</button>
  </div>`}`);
}

/* ---------- actions ---------- */
const actions = {
  noop(){},
  overlay(d, el, e){ if (e.target === el) closeSheet(); },
  close: closeSheet,
  settings: settingsSheet,
  "goto-cot"(){ ui.tab = "cotisations"; ui.month = curMonth; ui.cotView = "membres"; render(); scrollTo(0,0); },
  "goto-lieu"(d){ ui.tab = "membres"; ui.lieu = d.v; ui.fam = "all"; render(); scrollTo(0,0); },
  "goto-hist"(){ ui.tab = "cotisations"; ui.month = curMonth; ui.cotView = "mouvements"; render(); scrollTo(0,0); },
  pay(d){ if (!canPay()) return toast("Seul le trésorier enregistre les paiements."); closeSheet(); paySheet(d.member || null); },
  member(d){ memberSheet(d.id); },
  movement(d){ closeSheet(); movementSheet(d.id); },
  "add-member"(){ memberFormSheet(null); },
  declare(){ closeSheet(); declareSheet(); },
  "goto-decl"(){ ui.tab = "cotisations"; ui.cotView = "membres"; render(); scrollTo(0,0); },
  "decl-ok"(d){ const dc = state.declarations.find(x => x.id === d.id); if (!dc || !canPay()) return; store.confirmDecl(dc); render(); const m = memberById(dc.memberId); toast(`Paiement${m ? " de " + m.nom.split(" ")[0] : ""} confirmé`); },
  "decl-no"(d){ const dc = state.declarations.find(x => x.id === d.id); if (!dc) return; if (!confirm(canPay() ? "Refuser ce paiement ? Il sera retiré de la liste." : "Annuler ce paiement déclaré ?")) return; store.dropDecl(dc.id); render(); toast(canPay() ? "Paiement refusé" : "Déclaration annulée"); },
  async "reset-pin"(d){ const m = memberById(d.id); if (!m || !isAdmin()) return;
    if (!confirm(`Donner un nouveau code à ${m.nom} ? Son ancien code ne marchera plus.`)) return;
    const code = await store.resetPin(m); if (!code) return;
    resetSheet(m, code); },
  "relance"(){ relanceSheet(); },
  annonces(){ annoncesSheet(); render(); },
  collectes(){ collectesSheet(); },
  collecte(d){ closeSheet(); collecteSheet(d.id); },
  "add-collecte"(){ if (!canManageCollecte()) return; closeSheet(); collecteFormSheet(null); },
  "edit-collecte"(d){ if (!canManageCollecte()) return; closeSheet(); collecteFormSheet(collecteById(d.id)); },
  "toggle-collecte"(d){ const c = collecteById(d.id); if (!c || !canManageCollecte()) return;
    if (c.ouverte && !confirm("Terminer cette collecte ? Elle ne sera plus proposée dans les paiements.")) return;
    const etait = c.ouverte; store.updateCollecte(c.id, {ouverte:!etait}); closeSheet(); render(); toast(etait ? "Collecte terminée" : "Collecte rouverte"); },
  "pay-collecte"(d){ if (!canPay()) return; closeSheet(); paySheet(null, d.id); },
  "declare-collecte"(d){ closeSheet(); declareSheet(d.id); },
  annonce(d){ closeSheet(); annonceSheet(d.id); markAnnSeen(); render(); },
  "add-annonce"(){ closeSheet(); annonceFormSheet(null); },
  "edit-annonce"(d){ closeSheet(); annonceFormSheet(state.annonces.find(x => x.id === d.id)); },
  "delete-annonce"(d){ store.deleteAnnonce(d.id); closeSheet(); render(); toast("Annonce supprimée"); },
  bilan(){ bilanSheet(ui.month || curMonth); },
  print(){ window.print(); },
  "relance-sent"(d){ markRelance(d.id); const it = document.querySelector(`[data-relance="${CSS.escape(d.id)}"]`); if (it) it.textContent = "Envoyé ✓"; },
  "remove-photo"(d){ store.setPhoto(d.id, null); memberSheet(d.id); render(); toast("Photo enlevée"); },
  "my-profile"(){ const m = me(); if (m){ closeSheet(); memberSheet(m.id); } },
  "edit-member"(d){ closeSheet(); memberFormSheet(memberById(d.id)); },
  fam(d){ ui.fam = d.fam; render(); },
  lieu(d){ ui.lieu = d.v; render(); },
  vue(d){ ui.vue = d.v === "mosaique" ? "mosaique" : "liste"; try { localStorage.setItem("igna-djongo-vue", ui.vue); } catch(e){} render(); },
  month(d){ const n = shiftMonth(ui.month, Number(d.d)); if (n <= curMonth){ ui.month = n; render(); } },
  cotview(d){ ui.cotView = d.v; render(); },
  "ask-delete"(){ const c = document.getElementById("confirm-del"); if (c){ c.hidden = false; c.scrollIntoView({block:"nearest"}); } },
  "cancel-delete"(){ const c = document.getElementById("confirm-del"); if (c) c.hidden = true; },
  "delete-member"(d){ const m = memberById(d.id); if (m) store.deleteMember(m); closeSheet(); render(); toast("Membre retiré"); },
  "delete-movement"(d){ const p = state.payments.find(x => x.id === d.id); if (p) store.deletePayment(p); closeSheet(); render(); toast("Mouvement supprimé"); },
  chapter(d){ chapterSheet(d.id); },
  "add-chapter"(){ chapterFormSheet(null); },
  "edit-chapter"(d){ closeSheet(); chapterFormSheet(state.histoire.find(x => x.id === d.id)); },
  "delete-chapter"(d){ store.deleteChapter(d.id); closeSheet(); render(); toast("Chapitre supprimé"); },
  "auth-mode"(d){ authMode = d.v; render(); },
  logout(){ closeSheet(); store.logout(); authMode = "login"; render(); scrollTo(0,0); toast("Tu es déconnecté"); },
  "my-profile"(){ closeSheet(); if (me()) memberSheet(me().id); },
  reset(){ if (ONLINE) return; state = seed(); save(); closeSheet(); render(); toast("Données d'exemple remises"); },
  "clear-all"(){ if (ONLINE) return; setSession(null); authMode = "signup"; state = {...emptyState(), settings:{...state.settings}}; save(); closeSheet(); ui.fam = "all"; render(); toast("Liste vide : le premier compte créé sera le responsable"); },
  copy(d, el){
    const done = () => toast("Numéro copié");
    try { navigator.clipboard.writeText(d.text).then(done, () => selectPhone(el)); } catch(e){ selectPhone(el); }
  }
};
function selectPhone(el){ const span = el.parentElement.querySelector("span"); const r = document.createRange(); r.selectNodeContents(span); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Numéro sélectionné, copie-le"); }

document.addEventListener("click", e => {
  const tab = e.target.closest("nav.tabs button");
  if (tab){ ui.tab = tab.dataset.tab; if (ui.tab === "cotisations") ui.month = ui.month || curMonth; render(); scrollTo(0,0); return; }
  const el = e.target.closest("[data-action]"); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".overlay")) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.item[role="button"]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "pay-form") submitPay(e.target);
  else if (e.target.id === "member-form") submitMember(e.target);
  else if (e.target.id === "declare-form") submitDeclare(e.target);
  else if (e.target.id === "chapter-form") submitChapter(e.target);
  else if (e.target.id === "annonce-form") submitAnnonce(e.target);
  else if (e.target.id === "collecte-form") submitCollecte(e.target);
  else if (e.target.id === "login-form") submitLogin(e.target);
  else if (e.target.id === "renew-form") submitRenew(e.target);
  else if (e.target.id === "signup-form") submitSignup(e.target);
  else if (e.target.id === "join-form") submitJoin(e.target);
  else if (e.target.id === "settings-form"){
    const fd = new FormData(e.target); const v = parseFloat(String(fd.get("mensuelle")).replace(",", ".")), k = parseFloat(String(fd.get("mensuelleKMF")).replace(",", "."));
    if (v > 0 && k > 0){ store.saveSettings({mensuelle:v, mensuelleKMF:k}); closeSheet(); render(); toast("Réglages enregistrés"); }
  }
  else if (e.target.id === "invite-form"){
    const code = cleanCode(new FormData(e.target).get("code")); const err = e.target.querySelector("#inv-error");
    if (!validCode(code)){ err.textContent = "Au moins 4 lettres ou chiffres, sans espace."; err.hidden = false; return; }
    store.changeInvite(code); closeSheet(); toast("Nouveau code : " + code);
  }
  else if (e.target.id === "roles-form"){
    const fd = new FormData(e.target); const r = {admins:fd.getAll("a").map(String), tresoriers:fd.getAll("t").map(String)};
    const err = e.target.querySelector("#roles-error");
    if (!r.admins.length){ err.textContent = "Il faut au moins un responsable."; err.hidden = false; return; }
    store.saveRoles(r); closeSheet(); render(); toast("Rôles enregistrés");
  }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "photo-input") return;
  const file = e.target.files && e.target.files[0], id = e.target.dataset.id; if (!file) return;
  toast("Préparation de la photo…");
  let photo; try { photo = await shrinkPhoto(file); } catch(err){ return toast("Cette image ne marche pas. Essaie une autre photo."); }
  store.setPhoto(id, photo); if (document.getElementById("photo-input")) memberSheet(id); render(); toast("Photo enregistrée");
});
document.addEventListener("input", e => {
  if (e.target.id === "search-members"){ ui.q = e.target.value; document.getElementById("member-list").innerHTML = memberListHTML(); }
});
document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
render();
if (ONLINE) fbInit();
})();
</script>

</body>
</html>
