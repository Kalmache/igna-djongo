# Mise en ligne d'Igna Djongo sur l'hébergement OVH de mmbt.fr (M.M.B.T, 2026).
# À chaque changement sur main, GitHub envoie les fichiers de l'appli dans le dossier « igna » d'OVH,
# servi à l'adresse https://igna.mmbt.fr (multisite OVH).
name: Mise en ligne sur OVH
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOT_DE_PASSE }}
          local-dir: ./
          server-dir: ./igna/
          exclude: |
            **/.git*
            **/.git*/**
            source/**
            firestore.rules
            README.md
            CNAME
            .nojekyll
      - name: Vérifier igna.mmbt.fr
        run: |
          sleep 5
          for u in / /manifest.webmanifest /igna-djongo.apk; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{size_download} octets' "https://igna.mmbt.fr$u")"
          done
          echo "Fichier apk dans le dépôt : $(wc -c < igna-djongo.apk) octets"
          echo "Servi par : $(curl -sI https://igna.mmbt.fr/ | grep -i '^server:' || echo inconnu)"
